# Paste into Streamlit Cloud > App settings > Secrets, then replace placeholders.
# This example contains no real credentials. Keep paid AI OFF pending approval.
VLL_LIVE_AI = ""

[public_ai]
api_key = "REPLACE_WITH_DEDICATED_OPENAI_PROJECT_KEY"
project_id = "proj_REPLACE_WITH_OPENAI_PROJECT_ID"
# Set true only after verifying dedicated Project, model access and spend controls.
dedicated_project_verified = false
ledger_dsn = "postgresql://RUNTIME_USER:URL_ENCODED_PASSWORD@NEON_HOST/LEDGER_DATABASE?sslmode=verify-full&sslrootcert=system"
ca_cert = "system"
identity_issuer = "https://accounts.google.com"
# Independent random secret, at least 32 characters; preserve across deployments.
quota_hmac_secret = "REPLACE_WITH_STABLE_RANDOM_QUOTA_SECRET"
budget_microusd = 10000000
price_review_date = "2026-10-13"

[auth]
redirect_uri = "https://visual-learning-lab-kdemsgmw3swykt5zpqbkc5.streamlit.app/oauth2callback"
# A separate random secret, at least 32 characters; never expose provider tokens.
cookie_secret = "REPLACE_WITH_RANDOM_COOKIE_SECRET"
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
expose_tokens = []
