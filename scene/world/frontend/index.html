function spatial(svg,plane){svg.replaceChildren();let a=D.axes;if(plane){const vectorNums=P.objects.filter(o=>o.type==="vector").flatMap(o=>table(D).projections[o.id].slice(2).flat().concat(baseTable(D)?baseTable(D).projections[o.id].slice(2).flat():[]));const max=Math.max(1,...vectorNums.map(Math.abs))*1.25;a={x_min:-max,x_max:max,y_min:-max,y_max:max,x_label:D.axes.x_label,y_label:D.axes.y_label}}const c=coords(a);axes(svg,c,a);for(const obj of P.objects){if(plane&&obj.type!=="vector")continue;const nums=S.projections[obj.id];if(obj.type==="trajectory"){const rows=table(D).projections[obj.id],path=rows[0].map((x,i)=>[c.x(x),c.y(rows[1][i])].join(",")).join(" ");const trajectory=svgNode("polyline",{points:path,fill:"none",stroke:color(obj.semantic_id),"stroke-width":family().has(obj.semantic_id)?4:2,class:"trajectory"});const inv=P.inverse.find(b=>b.object_id===obj.id&&b.type==="nearest_path_time");if(inv)trajectory.addEventListener("click",e=>{const [x,y]=pointerPosition(svg,e);emit("inverse",{binding_id:inv.id,value:[c.ix(x),c.iy(y)]})});svg.append(trajectory,svgNode("circle",{cx:c.x(nums[0]),cy:c.y(nums[1]),r:6,fill:color(obj.semantic_id)}));if(D.baseline&&baseTable(D)){const rows=baseTable(D).projections[obj.id];svg.append(svgNode("polyline",{points:rows[0].map((x,i)=>[c.x(x),c.y(rows[1][i])].join(",")).join(" "),fill:"none",stroke:"#8792a7",class:"ghost"}))}}

function wave(){

function stateLens(){const el=$("metrics");el.replaceChildren();for(const item of P.parameters.concat(P.metrics)){const factor=item.display?item.display.factor:1,unit=item.display?item.display.unit:item.unit,value=(item.semantic_id?S.projections[item.id][0]:S.parameters[item.id])*factor,row=document.createElement("div");row.className="metric"+(item.semantic_id&&family().has(item.semantic_id)?" focus":"");const label=document.createElement("span"),number=document.createElement("span");number.className="value";text(label,item.label);text(number,fmt(value)+" "+unit);row.append(label,number);if(item.semantic_id)row.onclick=()=>patch("set_focus",item.semantic_id,null);if(D.baseline){const before=(item.semantic_id?D.baseline.projections[item.id][0]:D.baseline.parameters[item.id])*factor,delta=document.createElement("div");delta.className="delta";text(delta,t("Baseline")+": "+fmt(before)+" · "+t("Delta")+": "+fmt(value-before));row.append(delta)}el.append(row)}const q=P.quantities.find(q=>q.id===S.focus),eq=$("equations");eq.replaceChildren();for(const id of q?[S.focus,...q.family.filter(id=>id!==S.focus).slice(0,3)]:[]){const quantity=P.quantities.find(q=>q.id===id),p=document.createElement("div");p.className="equation";text(p,quantity.label+" = "+quantity.equation+" = "+fmt(S.values[id])+" "+quantity.unit);eq.append(p)}}
function draw(){

function tick(now){
 if(!playing)return;
 // One clock, including the camera. Gate the entire coordinated projection,
 // rather than queue 3D snapshots behind a waveform that keeps running ahead.

   if(now-lastReplay>=replayDwell($("replaySpeed").value)){
     lastReplay=now;replayIndex++;

   // current derived endpoint: changing frequency can really change rotation.

   clockTime+=delta;chooseTime(Math.min(domain().max,clockTime));
   if(clockTime>=domain().max){stop(true);return}
