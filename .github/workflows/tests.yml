name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VLL_LIVE_AI: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -X utf8 -B -m unittest discover -s tests -p test_local_launch.py -v
      - run: python -X utf8 -B tools/day30_verify.py full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: docs/day30/full-results.json
